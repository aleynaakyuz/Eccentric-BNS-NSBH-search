[variable_params]
tau0 =
spin1z = 
spin2z = 
eccentricity = 

anomaly =
q =

ra =
dec =
polarization =
coa_phase =
inclination =
chirp_distance =

[static_params]
approximant = teobresums
lambda1 = 0
lambda2 = 0
f_lower = 20
skip_merger = True
ode_abstol = 1e-8
ode_reltol = 1e-8

lmax_nyquist = 0
taper = start
taper_window = 2
taper_method = constant

[prior-spin1z]
name = uniform
min-spin1z = -0.1
max-spin1z = 0.1

[prior-spin2z]
name = uniform
min-spin2z = -0.1 
max-spin2z = 0.1

[prior-anomaly]
name = uniform_angle

[prior-eccentricity]
name = uniform
min-eccentricity = 0.27414413
max-eccentricity = 0.28035338

[prior-tau0]
name = uniform
min-tau0 = 58.06026899054807
max-tau0 = 58.70874035796194

[prior-q]
name = uniform
min-q = 1.0000548588594171
max-q = 7.807477640702832

[prior-chirp_distance]
name = uniform
min-chirp_distance = 10
max-chirp_distance = 1000

[prior-coa_phase]
name = uniform_angle

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[waveform_transforms-mchirp]
name = custom
inputs = tau0
mchirp = mchirp_from_tau0(tau0, f_lower=20)

[waveform_transforms-mass1]
name = custom
inputs = mchirp, q    
mass1 = mass1_from_mchirp_q(mchirp, q)

[waveform_transforms-mass2]
name = custom
inputs = mchirp, q
mass2 = mass2_from_mchirp_q(mchirp, q)

[waveform_transforms-mean_anomaly+mean_per_ano+rel_anomaly]
name = custom
inputs = anomaly
# needed for esigma
mean_anomaly = anomaly
# neeed for teobresums
mean_per_ano = anomaly
# Needed for seob
rel_anomaly = anomaly

[waveform_transforms-distance]
name = chirp_distance_to_distance
