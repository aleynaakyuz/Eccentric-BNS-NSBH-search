[variable_params]
tau0 =
spin1_a =
spin1_azimuthal =
spin1_polar =
spin2_a =
spin2_azimuthal =
spin2_polar =
eccentricity = 

anomaly =
q =

ra =
dec =
polarization =
coa_phase =
inclination =
chirp_distance =

[static_params]
approximant = teobresums
lambda1 = 0
lambda2 = 0
f_lower = 20
skip_merger = True
ode_abstol = 1e-8
ode_reltol = 1e-8

lmax_nyquist = 0
taper = start
taper_window = 2
taper_method = constant

[prior-anomaly]
name = uniform_angle

[prior-eccentricity]
name = uniform
min-eccentricity = 0.27414413
max-eccentricity = 0.28035338

[prior-tau0]
name = uniform
min-tau0 = 58.06026899054807
max-tau0 = 58.70874035796194

[prior-q]
name = uniform
min-q = 1.0000548588594171
max-q = 7.807477640702832

[prior-chirp_distance]
name = uniform
min-chirp_distance = 10
max-chirp_distance = 1000

[prior-coa_phase]
name = uniform_angle

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.1

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.1

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[waveform_transforms-mchirp]
name = custom
inputs = tau0
mchirp = mchirp_from_tau0(tau0, f_lower=20)

[waveform_transforms-mass1]
name = custom
inputs = mchirp, q    
mass1 = mass1_from_mchirp_q(mchirp, q)

[waveform_transforms-mass2]
name = custom
inputs = mchirp, q
mass2 = mass2_from_mchirp_q(mchirp, q)

[waveform_transforms-mean_anomaly+mean_per_ano+rel_anomaly]
name = custom
inputs = anomaly
# needed for esigma
mean_anomaly = anomaly
# neeed for teobresums
mean_per_ano = anomaly
# Needed for seob
rel_anomaly = anomaly

[waveform_transforms-distance]
name = chirp_distance_to_distance
